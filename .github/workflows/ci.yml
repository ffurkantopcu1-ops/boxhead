name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check
        env:
          PYTHONUTF8: '1'
        run: python check_all_syntax.py

      - name: Import smoke test
        env:
          PYGAME_HIDE_SUPPORT_PROMPT: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -c "import pygame; pygame.init(); from logic.version import get_version; print(f'Version: {get_version()}')"

      - name: Unit tests
        env:
          PYTHONUTF8: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest tests/ -v --tb=short
