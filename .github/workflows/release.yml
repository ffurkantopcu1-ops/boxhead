name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.6.0)'
        required: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Determine version tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $ver = $tag -replace '^v', ''
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Validate version matches version.txt
        shell: pwsh
        run: |
          $fileVer = (Get-Content version.txt -Raw).Trim()
          $tagVer = "${{ steps.version.outputs.VERSION }}"
          if ($fileVer -ne $tagVer) {
            Write-Error "Version mismatch: version.txt='$fileVer' but tag='$tagVer'"
            exit 1
          }
          Write-Host "Version validated: $fileVer"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build game with PyInstaller
        run: pyinstaller Boxhead.spec --noconfirm

      - name: Smoke test packaged game
        shell: pwsh
        run: |
          $game = Start-Process -FilePath "dist/Boxhead.exe" -ArgumentList "--smoke-test" -WindowStyle Hidden -PassThru
          if (-not $game.WaitForExit(90000)) {
            $game.Kill()
            throw "Packaged game startup timed out"
          }
          if ($game.ExitCode -ne 0) {
            Get-Content logs/startup.log -ErrorAction SilentlyContinue
            throw "Packaged game exited with code $($game.ExitCode)"
          }
          if (-not (Test-Path smoke_result.json)) { throw "Missing startup verification" }
          $result = Get-Content smoke_result.json -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw "Packaged startup verification failed" }

      - name: Build launcher with PyInstaller
        run: pyinstaller Boxhead_Launcher.spec --noconfirm

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $zipName = "Boxhead-$ver-win64.zip"

          # Create staging directory
          New-Item -ItemType Directory -Path release_staging -Force
          Copy-Item dist/Boxhead.exe release_staging/
          Copy-Item -Recurse assets release_staging/assets
          Copy-Item -Recurse sounds release_staging/sounds
          Copy-Item version.txt release_staging/
          New-Item -ItemType Directory -Path release_staging/data -Force
          Copy-Item data/patch_notes.json release_staging/data/
          Copy-Item data/skill_tree.json release_staging/data/

          # Create ZIP
          Compress-Archive -Path release_staging/* -DestinationPath $zipName -Force

          # SHA-256 checksum
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          $hash | Out-File -FilePath "$zipName.sha256" -Encoding utf8 -NoNewline

          # update.json manifest
          # min_launcher_version SABIT "1.0.0" yaziliyordu; launcher'daki
          # "guncelleme gerekli" uyarisi bu yuzden HIC tetiklenmiyordu ve
          # eski/hatali launcher kullanan oyuncu bunu asla ogrenemiyordu.
          # Artik tek kaynak launcher/config.py.
          $size = (Get-Item $zipName).Length
          $minLauncher = (python -c "import launcher.config as c; print(c.MIN_LAUNCHER_VERSION)").Trim()
          $curLauncher = (python -c "import launcher.config as c; print(c.LAUNCHER_VERSION)").Trim()
          if (-not $minLauncher -or -not $curLauncher) {
            Write-Error "launcher/config.py surum degerleri okunamadi"
            exit 1
          }
          Write-Host "min_launcher_version = $minLauncher / latest = $curLauncher"
          $manifest = @{
            version = $ver
            filename = $zipName
            sha256 = $hash
            size = $size
            min_launcher_version = $minLauncher
            # Bu yayindaki Launcher.exe'nin surumu. Launcher kendini
            # guncelleyemedigi icin eski surum kullanan oyuncu bununla
            # bilgilendirilir (bkz. launcher/main.py latest_launcher_version).
            latest_launcher_version = $curLauncher
          } | ConvertTo-Json -Depth 3
          $manifest | Out-File -FilePath "update.json" -Encoding utf8

          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Boxhead v${{ steps.version.outputs.VERSION }}
          body: |
            ## Boxhead v${{ steps.version.outputs.VERSION }}

            ### Kurulum
            1. `Launcher.exe` dosyasını indirin
            2. İstediğiniz boş bir klasöre koyup çalıştırın
            3. Launcher oyunu otomatik olarak indirip güncel tutar

            **[Launcher.exe dosyasını doğrudan indir](https://github.com/${{ github.repository }}/releases/latest/download/Launcher.exe)**

            ### Checksum (SHA-256)
            ```
            ${{ steps.package.outputs.SHA256 }}
            ```
          files: |
            dist/Launcher.exe
            ${{ steps.package.outputs.ZIP_NAME }}
            ${{ steps.package.outputs.ZIP_NAME }}.sha256
            update.json
          draft: false
          prerelease: false
